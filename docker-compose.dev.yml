services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalgpt-backend-dev
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8000
      - CHROMA_PERSIST_DIR=/app/chroma_db
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - chroma_data_dev:/app/chroma_db
    networks:
      - legalgpt-network

  frontend:
    image: node:20-alpine
    container_name: legalgpt-frontend-react-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - legalgpt-network

  svelte-frontend:
    image: node:20-alpine
    container_name: legalgpt-frontend-svelte-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./svelte-frontend:/app
      - /app/node_modules
    networks:
      - legalgpt-network

volumes:
  chroma_data_dev:
    driver: local

networks:
  legalgpt-network:
    driver: bridge
